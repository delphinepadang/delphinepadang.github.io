project:
  type: website
  output-dir: docs          # the finished site goes here (GitHub Pages serves this folder)

website:
  title: "Delphine PA Dang"
  description: "Vietnamese artist, musician and researcher-in-training in Sydney, working across film, music, political theory and data science."
  favicon: images/an-eye-for-an-i.jpg
  open-graph: true
  navbar:
    left:
      - href: art-music.qmd
        text: Art & Music
      - href: research.qmd
        text: Research
      - href: about.qmd
        text: Biography
    right:
      - icon: linkedin
        href: https://www.linkedin.com/in/phuonganh-dang/
        aria-label: LinkedIn
      - icon: instagram
        href: https://www.instagram.com/delphinedang/
        aria-label: Instagram
      - icon: envelope
        href: mailto:delphinepadang@gmail.com
        aria-label: Email
  page-footer:
    left: "© 2026 Delphine PA Dang, Sydney"

format:
  html:
    theme: [cosmo, theme.scss]     # colours & fonts live in theme.scss
    include-after-body: assets/site.html   # video pop-ups, the eye, the survey
    anchor-sections: false
    toc: false
    smooth-scroll: true
    grid:
      body-width: 1040px
