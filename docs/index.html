<script>
(function () {
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- 1. Home page: a live lens over the photo, and a name that reacts ---------- */
  const photo = document.querySelector('.hero-photo');
  if (photo) {
    document.body.classList.add('home', 'at-top');
    const img = photo.querySelector('img');
    const canvas = photo.querySelector('canvas');
    const screen = document.querySelector('.hero-screen');
    const fit = () => {                       // first screen starts at the very top, behind the menu bar
      if (!screen) return;
      screen.style.marginTop = '0px';
      const top = screen.getBoundingClientRect().top + window.scrollY;
      screen.style.marginTop = (-top) + 'px';
      screen.classList.add('fitted');
    };
    fit();
    window.addEventListener('resize', fit);

    // Split the name into letters so each one can change weight
    const nameEl = document.querySelector('.hero-name');
    const letters = [];
    if (nameEl) {
      nameEl.setAttribute('aria-label', nameEl.textContent.replace(/\s+/g, ' ').trim());
      nameEl.querySelectorAll(':scope > span').forEach((line, li) => {
        const text = line.textContent;
        line.textContent = '';
        line.setAttribute('aria-hidden', 'true');
        for (const ch of text) {
          const s = document.createElement('span');
          s.className = 'ch';
          s.textContent = ch === ' ' ? ' ' : ch;
          line.appendChild(s);
          // first line is heavy and thins under the cursor; second is light and thickens
          const base = li === 0 ? 720 : 220, peak = li === 0 ? 160 : 900;
          letters.push({ el: s, base, peak, w: base });
        }
      });
    }

    if (!reduceMotion) {
      const st = { tx: .62, ty: .42, x: .62, y: .42, vel: 0, pointer: false, click: [-1, -1, -99] };
      const t0 = performance.now();
      const isUI = e => e.target.closest && e.target.closest('a, button, input, .navbar');
      window.addEventListener('pointermove', e => {
        st.pointer = true;
        st.tx = e.clientX / innerWidth;
        st.ty = e.clientY / innerHeight;
      }, { passive: true });
      window.addEventListener('pointerdown', e => {
        if (isUI(e)) return;
        st.pointer = true;
        st.tx = e.clientX / innerWidth; st.ty = e.clientY / innerHeight;
        st.click = [st.tx, st.ty, (performance.now() - t0) / 1000];
      });

      const gl = startLens(canvas, img);
      if (gl) photo.classList.add('gl-on');

      (function tick(now) {
        const s = (now - t0) / 1000;
        if (!st.pointer) {                   // before anyone moves: drift slowly on its own
          st.tx = .5 + .24 * Math.sin(s * .35);
          st.ty = .45 + .14 * Math.sin(s * .5);
        }
        const px = st.x, py = st.y;
        st.x += (st.tx - st.x) * .07;
        st.y += (st.ty - st.y) * .07;
        const speed = Math.hypot(st.x - px, st.y - py);
        st.vel += (Math.min(1, speed * 40) - st.vel) * .1;

        if (gl) gl(st, s);
        else {                               // no WebGL: soft CSS light instead
          photo.style.setProperty('--x', (st.x * 100).toFixed(2) + '%');
          photo.style.setProperty('--y', (st.y * 100).toFixed(2) + '%');
        }

        // letters: weight follows the distance to the cursor
        const mx = st.x * innerWidth, my = st.y * innerHeight, R = Math.max(220, innerWidth * .2);
        for (const L of letters) {
          const r = L.el.getBoundingClientRect();
          const d = Math.hypot(r.left + r.width / 2 - mx, r.top + r.height / 2 - my);
          const k = Math.pow(Math.max(0, 1 - d / R), 1.6);
          const target = L.base + (L.peak - L.base) * k;
          L.w += (target - L.w) * .12;
          L.el.style.fontWeight = Math.round(L.w);
        }
        requestAnimationFrame(tick);
      })(t0);
    }
  }

  // WebGL lens: magnifies the photo around the cursor, splits colour when moving, ripples on click
  function startLens(canvas, img) {
    if (!canvas || !img) return null;
    const gl = canvas.getContext('webgl', { antialias: false, alpha: false, premultipliedAlpha: false });
    if (!gl) return null;
    const vs = 'attribute vec2 p; varying vec2 vUv; void main(){ vUv = vec2((p.x+1.)*.5, (1.-p.y)*.5); gl_Position = vec4(p,0.,1.); }';
    const fs = `precision highp float;
      uniform sampler2D uTex; uniform vec2 uRes, uImg, uPos, uMouse; uniform float uVel, uTime, uIntro; uniform vec3 uClick;
      varying vec2 vUv;
      vec2 cover(vec2 uv){ float rc=uRes.x/uRes.y, ri=uImg.x/uImg.y; vec2 s = rc>ri ? vec2(1., ri/rc) : vec2(rc/ri, 1.); return uPos*(1.-s) + uv*s; }
      float hash(vec2 q){ return fract(sin(dot(q, vec2(12.9898,78.233)))*43758.5453); }
      void main(){
        float a = uRes.x/uRes.y;
        vec2 uv = vUv;
        vec2 p = vec2(uv.x*a, uv.y), m = vec2(uMouse.x*a, uMouse.y);
        float d = length(p - m);
        float f = 1. - smoothstep(0., .34, d);
        vec2 dir = uv - uMouse;
        uv = uMouse + dir*(1. - .2*f*f);                         // lens
        float t = uTime - uClick.z;                                // ripple after a click
        if (t > 0. && t < 2.6) {
          vec2 c = vec2(uClick.x*a, uClick.y); vec2 v = p - c; float dc = length(v);
          float w = exp(-pow((dc - t*.6)*8., 2.)) * (1. - t/2.6);
          uv += (v/(dc+1e-4)) * vec2(1./a, 1.) * w * .03;
        }
        uv = .5 + (uv - .5)*(.975 - .008*sin(uTime*.4));        // slow breathing
        vec2 cd = normalize(dir + 1e-5);
        float ca = (.0025 + uVel*.03)*f;                           // colour split
        vec3 col = vec3(texture2D(uTex, cover(uv + cd*ca)).r, texture2D(uTex, cover(uv)).g, texture2D(uTex, cover(uv - cd*ca)).b);
        float light = mix(.3, 1.15, pow(1. - smoothstep(0., .6, d), 1.4));
        col = col*light + vec3(.07,.04,.02)*f;
        col += (hash(vUv*uRes + fract(uTime)*91.) - .5)*.045;      // film grain
        gl_FragColor = vec4(col*uIntro, 1.);
      }`;
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : null; };
    const v = sh(gl.VERTEX_SHADER, vs), f = sh(gl.FRAGMENT_SHADER, fs);
    if (!v || !f) return null;
    const prog = gl.createProgram();
    gl.attachShader(prog, v); gl.attachShader(prog, f); gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return null;
    gl.useProgram(prog);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'p');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const U = n => gl.getUniformLocation(prog, n);
    const u = { tex: U('uTex'), res: U('uRes'), img: U('uImg'), pos: U('uPos'), mouse: U('uMouse'), vel: U('uVel'), time: U('uTime'), intro: U('uIntro'), click: U('uClick') };

    let ready = false, introStart = 0;
    const tex = gl.createTexture();
    const upload = () => {
      try {
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
        if (gl.getError() !== gl.NO_ERROR) throw new Error('texture');
        ready = true; introStart = performance.now();
      } catch (e) { canvas.closest('.hero-photo').classList.remove('gl-on'); }
    };
    if (img.complete && img.naturalWidth) upload(); else img.addEventListener('load', upload);

    const size = () => {
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      canvas.width = Math.round(canvas.clientWidth * dpr);
      canvas.height = Math.round(canvas.clientHeight * dpr);
      gl.viewport(0, 0, canvas.width, canvas.height);
    };
    size();
    window.addEventListener('resize', size);
    const narrow = () => innerWidth < 768;

    return (st, time) => {
      if (!ready) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      if (canvas.width !== Math.round(canvas.clientWidth * dpr) || canvas.height !== Math.round(canvas.clientHeight * dpr)) size();
      const k = Math.min(1, (performance.now() - introStart) / 1800);
      gl.uniform1i(u.tex, 0);
      gl.uniform2f(u.res, canvas.width, canvas.height);
      gl.uniform2f(u.img, img.naturalWidth, img.naturalHeight);
      gl.uniform2f(u.pos, narrow() ? .26 : .45, .5);
      gl.uniform2f(u.mouse, st.x, st.y);
      gl.uniform1f(u.vel, st.vel);
      gl.uniform1f(u.time, time);
      gl.uniform1f(u.intro, 1 - Math.pow(1 - k, 3));
      gl.uniform3f(u.click, st.click[0], st.click[1], st.click[2]);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    };
  }

  /* ---------- 2. Video pop-up for any block with data-video="YOUTUBE_ID" ---------- */
  const dialog = document.querySelector('.video-dialog');
  const frame = dialog.querySelector('iframe');
  const openVideo = (id, title) => {
    frame.src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&rel=0';
    frame.title = title || 'Video';
    dialog.showModal();
  };
  const closeVideo = () => { dialog.close(); };
  dialog.addEventListener('close', () => { frame.src = ''; });
  dialog.querySelector('.close').addEventListener('click', closeVideo);
  dialog.addEventListener('click', e => { if (e.target === dialog) closeVideo(); });

  // data-video="YOUTUBE_ID" plays in the pop-up; data-link="https://..." opens in a new tab
  document.querySelectorAll('[data-video], [data-link]').forEach(work => {
    const id = (work.dataset.video || '').trim();
    const link = (work.dataset.link || '').trim();
    if (!id && !link) return;
    const heading = work.querySelector('h2, h3');
    const title = work.dataset.title || (heading ? heading.textContent.trim() : 'video');

    const makeAction = (el, cls) => {
      if (id) {
        el.type = 'button';
        el.addEventListener('click', () => openVideo(id, title));
      } else {
        el.href = link;
        el.target = '_blank';
        el.rel = 'noopener';
      }
      el.className = cls;
      return el;
    };
    const tag = id ? 'button' : 'a';

    const img = work.querySelector('img.poster, img.thumb, img.cover');
    if (img) {
      const wrap = makeAction(document.createElement(tag), 'play-wrap' + (id ? '' : ' offsite'));
      wrap.setAttribute('aria-label', id ? 'Play ' + title : 'Open ' + title + ' (new tab)');
      img.replaceWith(wrap);
      wrap.appendChild(img);
      img.addEventListener('error', () => {            // if a YouTube thumbnail can't load
        const ph = document.createElement('div');
        ph.className = 'thumb';
        img.replaceWith(ph);
      });
      if (img.complete && img.naturalWidth === 0 && img.getAttribute('src')) img.dispatchEvent(new Event('error'));
    }

    if (work.dataset.button !== 'none') {
      const text = work.querySelector('.work-text') || work;
      const btn = makeAction(document.createElement(tag), 'btn-watch' + (id ? '' : ' offsite'));
      btn.textContent = work.dataset.label || (id ? 'Watch the film' : 'Open');
      text.appendChild(btn);
    }
  });

  /* ---------- 3. Research timeline: click a title to open the details ---------- */
  document.querySelectorAll('.entry').forEach((entry, i) => {
    const h = entry.querySelector('h3');
    if (!h) return;
    const parent = h.parentElement;
    const rest = [];
    let n = h.nextElementSibling;
    while (n) { if (!n.classList.contains('meta')) rest.push(n); n = n.nextElementSibling; }
    if (!rest.length) return;

    const body = document.createElement('div');
    body.className = 'entry-body';
    body.id = 'entry-body-' + i;
    const inner = document.createElement('div');
    body.appendChild(inner);
    rest.forEach(el => inner.appendChild(el));
    parent.appendChild(body);

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'entry-toggle';
    btn.setAttribute('aria-controls', body.id);
    while (h.firstChild) btn.appendChild(h.firstChild);
    const sign = document.createElement('span');
    sign.className = 'sign';
    sign.setAttribute('aria-hidden', 'true');
    sign.textContent = '+';
    btn.appendChild(sign);
    h.appendChild(btn);

    const set = open => { btn.setAttribute('aria-expanded', open); body.classList.toggle('open', open); };
    set(entry.classList.contains('open'));
    btn.addEventListener('click', () => set(btn.getAttribute('aria-expanded') !== 'true'));
  });

  /* ---------- 4. Two-question survey on the Research page (nothing is saved) ---------- */
  const survey = document.getElementById('survey');
  if (survey) {
    const words = ['', 'Strongly disagree', 'Disagree', 'Somewhat disagree', 'Neither agree nor disagree', 'Somewhat agree', 'Agree', 'Strongly agree'];
    const questions = [
      'A work of art can communicate a research finding.',
      'Art and research are best kept apart.'
    ];
    let answers = [];

    const scaleHTML = (qi) =>
      '<p class="survey-step">Question ' + (qi + 1) + ' of 2</p>' +
      '<p class="survey-q" id="survey-q' + qi + '">' + questions[qi] + '</p>' +
      '<div class="scale" role="group" aria-labelledby="survey-q' + qi + '">' +
        '<span class="track" aria-hidden="true"></span>' +
        [1,2,3,4,5,6,7].map(v => '<button type="button" class="dot" data-v="' + v + '" aria-pressed="false" aria-label="' + v + ', ' + words[v] + '"><span>' + v + '</span></button>').join('') +
      '</div>' +
      '<div class="scale-ends" aria-hidden="true"><span>Strongly disagree</span><span class="hint"></span><span>Strongly agree</span></div>';

    const show = (html) => {
      survey.classList.add('fading');
      setTimeout(() => {
        survey.innerHTML = html;
        survey.classList.remove('fading');
        wire();
      }, reduceMotion ? 0 : 280);
    };

    const ask = (qi) => show(scaleHTML(qi));

    const result = () => {
      const a = answers[0];
      const b = 8 - answers[1];              // flip the second answer
      const gap = Math.abs(a - b);
      const head = gap <= 1 ? 'Your answers held together.' : gap <= 3 ? 'Your answers drifted a little.' : 'Your answers pulled apart.';
      const pos = v => ((v - 0.5) / 7 * 100).toFixed(2) + '%';   // centre of each of the 7 columns
      const edge = v => v <= 2 ? ' edge-l' : v >= 6 ? ' edge-r' : '';
      const lo = Math.min(a, b), hi = Math.max(a, b);
      const same = a === b;
      show(
        '<p class="survey-step">Your result</p>' +
        '<p class="survey-q">' + head + '</p>' +
        '<div class="compare" aria-hidden="true">' +
          '<span class="track"></span>' +
          '<span class="band" style="left:' + pos(lo) + ';width:calc(' + pos(hi) + ' - ' + pos(lo) + ')"></span>' +
          '<span class="mark m1' + edge(a) + '" style="left:' + pos(a) + '"><em>' + (same ? 'Both answers' : 'Question 1') + '</em></span>' +
          (same ? '' : '<span class="mark m2' + edge(b) + '" style="left:' + pos(b) + '"><em>Question 2, flipped</em></span>') +
        '</div>' +
        '<div class="scale-ends" aria-hidden="true"><span>Disagree</span><span>Agree</span></div>' +
        '<p class="survey-note">You answered ' + a + ', then ' + answers[1] + ' (a ' + b + ' once flipped). ' +
        'Surveys often ask the same thing twice, once reversed, to check that answers hold together. ' +
        'My research asks whether language models\u2019 answers do.</p>' +
        '<p class="survey-actions"><button type="button" class="btn-watch again">Start again</button><span>Nothing you click is saved.</span></p>'
      );
    };

    function wire() {
      const hint = survey.querySelector('.hint');
      survey.querySelectorAll('.dot').forEach(d => {
        const v = +d.dataset.v;
        const say = () => { if (hint) hint.textContent = words[v]; };
        d.addEventListener('mouseenter', say);
